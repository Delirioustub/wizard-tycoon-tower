let ac;function chime(n=0){try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();[0,.11].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+d;o.type='sine';o.frequency.value=[523,784,440,659,587,880][n*2+i];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.55);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.6)})}catch(e){}}

const SK=[0xF2C6A0,0xD9A07A,0xA9714B,0xFBD9C0],VAR=[{r:0xC0392B,h:0,hc:0x7A3E6B},{r:0x2E86C1,h:1,hc:0x8A7FB0},{r:0x27AE60,h:2,hc:0x5A3A28},{r:0xE59F2E,h:0,hc:0xB9783A},{r:0x8E44AD,h:1,hc:0xC9D3E6},{r:0x16A596,h:2,hc:0x3B3358}];
const cust=[],csl=[null,null,null];let spawnT=1.2,seed=1;
function mkCust(v){const g=new T.Group(),b=bk(false),sk=SK[Math.random()*4|0];
 S(b,CY(.28,.42,.95,7),v.r,0,.75,0);S(b,SP(.27,8,6),sk,0,1.45,0);S(b,SP(.04,4,3),0x1B1534,-.1,1.47,.24);S(b,SP(.04,4,3),0x1B1534,.1,1.47,.24);S(b,BX(.5,.14,.5),0x5A3A28,0,.95,0);S(b,BX(.34,.5,.2),0xA5683A,0,.9,-.36);S(b,BX(.4,.12,.22),v.hc,0,1.2,-.36);
 if(v.h==0){S(b,CY(.5,.5,.06,8),v.hc,0,1.66,0);S(b,CO(.3,.8,7),v.hc,0,2.05,0,{rz:.15})}
 else if(v.h==1){S(b,SP(.3,8,5),v.hc,0,1.6,-.02,{sy:.8});S(b,CY(.32,.32,.07,8),0x5A3A28,0,1.58,0);S(b,BX(.06,.35,.06),0xFF6F9C,.2,1.9,-.05,{rz:-.5})}
 else{S(b,SP(.34,8,6),v.hc,0,1.5,-.06,{sy:1.05});S(b,CO(.14,.4,5),v.hc,0,1.95,-.1,{rx:-.4})}
 flush(b,MV,g);const lg=bk(false);S(lg,BX(.16,.4,.2),0x3B2A20,-.13,0,0);flush(lg,MV,g);const ll=g.children[1];ll.position.y=.2;
 const rl=ll.clone();rl.position.x=.26;g.add(rl);g.userData={ll,rl};return g}
const bubs=[0,1,2].map(()=>{const e=document.createElement('div');e.className='bub';e.innerHTML='<span class="tb"></span><span class="ck">✓</span><i></i>';document.body.appendChild(e);return e});
function setBub(e,k){e.style.setProperty('--c',A[k].h);e.className='bub t'+A[k].t;e.querySelector('.tb').textContent='T'+A[k].t;e.querySelector('i').innerHTML=IC[k]}
function spawnCust(){const si=csl.indexOf(null);if(si<0)return;
 const v=VAR[seed++*7%6],g=mkCust(v);g.position.set(ctx.door[0],0,ctx.door[1]);g.scale.setScalar(.01);s.add(g);
 const c={g,v,si,k:Math.random()*3|0,path:[new T.Vector3(...ctx.lane.slice(0,1),0,ctx.lane[1]),new T.Vector3(ctx.spots[si][0],0,ctx.spots[si][1])],st:'in',wait:0,ph:Math.random()*6,bub:bubs[si],sc:0,hop:0};
 csl[si]=c;cust.push(c);setBub(c.bub,c.k);c.bub.style.display='none'}
function serve(c){const i=stock.findIndex(x=>x.ready&&x.k==c.k);if(i<0)return false;const sl=stock[i];sl.ready=false;sl.k=-1;const m=sl.m;sl.m=null;
 tweens.push({o:m,f:m.position.clone(),to:new T.Vector3(c.g.position.x,1.5,c.g.position.z-.5),t:0,dur:.5,arc:.5,fs:m.scale.x,ts:.2,done(){s.remove(m);const v=A[c.k].v;coins+=v;sold++;ui();persist();chime(1+(sold%2)*0);
  const q=pr(new T.Vector3(c.g.position.x,2.2,c.g.position.z));const p=document.createElement('div');p.className='pop';p.textContent='+'+v+' 🪙';p.style.transform='translate(-50%,0)';p.style.left=q[0]+'px';p.style.top=q[1]+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
  spark.mat.color.set(P.gold);spark.emit(c.g.position.x,1.6,c.g.position.z-.4,18,2.5,3,.8);hudBump()}});
 c.hop=.5;return true}
const hud=$('hud');function hudBump(){hud.animate([{transform:'scale(1.2)'},{transform:'scale(1)'}],200)}
function leave(c,happy){c.st='out';c.bub.style.display='none';csl[c.si]=null;const x=c.g.position.x;c.path=[new T.Vector3(x,0,.6),new T.Vector3(ctx.lane[0],0,.6),new T.Vector3(ctx.door[0],0,ctx.door[1])];c.happy=happy}
function shift(){for(let i=1;i<3;i++)if(csl[i]&&!csl[i-1]){const c=csl[i];csl[i]=null;csl[i-1]=c;c.si=i-1;c.bub=bubs[i-1];bubs[i].style.display='none';setBub(c.bub,c.k);c.path=[new T.Vector3(ctx.spots[i-1][0],0,ctx.spots[i-1][1])];c.st='in'}}
function updCust(dt,t){
 for(const c of cust){const g=c.g;let mv=false;
  if(c.path.length){const p=c.path[0],dx=p.x-g.position.x,dz=p.z-g.position.z,d=Math.hypot(dx,dz),sp=1.9*dt;mv=true;
   if(d<=sp){g.position.x=p.x;g.position.z=p.z;c.path.shift()}else{g.position.x+=dx/d*sp;g.position.z+=dz/d*sp;const ty=Math.atan2(dx,dz);let df=ty-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));g.rotation.y+=df*Math.min(1,dt*10)}}
  else if(c.st=='in'){c.st='wait';c.wait=0}
  g.rotation.y+=(()=>{if(c.path.length||c.st=='out')return 0;let df=Math.PI-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));return df*Math.min(1,dt*8)})();
  c.sc=c.st=='out'?Math.max(0,Math.min(1,Math.hypot(g.position.x-ctx.door[0],g.position.z-ctx.door[1])/.8)):Math.min(1,c.sc+dt*2.2);g.scale.setScalar(Math.max(.01,c.sc));

  if(c.st=='wait'){c.wait+=dt;const ok=count(c.k)>0;c.bub.style.display='flex';c.bub.classList.toggle('ok',ok);
   if(c.si==0&&ok&&c.wait>.9&&!c.buying){c.buying=true;if(serve(c)){c.bub.style.display='none';setTimeout(()=>{if(c.st=='wait')leave(c,true)},900)}else c.buying=false}

  if(c.st=='wait'&&c.bub.style.display=='flex'){const q=pr(new T.Vector3(g.position.x,2.3,g.position.z));c.bub.style.transform='translate('+(q[0]-22)+'px,'+(q[1]-34)+'px)'}}
 for(let i=cust.length-1;i>=0;i--)if(cust[i].dead)cust.splice(i,1);
 shift();spawnT-=dt;if(spawnT<=0){spawnT=6+Math.random()*5;if(csl.includes(null))spawnCust()}}
// ---------- update (deterministic; also driven by __dbg.sim) ----------
let T0=0;
function update(dt){T0+=dt;const t=T0;
 for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const u=Math.min(1,w.t/w.dur),e=u*u*(3-2*u);w.o.position.lerpVectors(w.f,w.to,e);w.o.position.y+=Math.sin(u*Math.PI)*w.arc;if(w.ts!=null)w.o.scale.setScalar(w.fs+(w.ts-w.fs)*e);if(u>=1){tweens.splice(i,1);w.done&&w.done()}}
 for(const sl of stock)if(sl.ready&&sl.m){const m=sl.m,k=sl.k;if(k==1){m.rotation.y+=dt*1.8;m.position.y=sl.p.y+ITEM_Y[k]+Math.sin(t*2+sl.p.x)*.05}else if(k==2){m.rotation.y+=dt;const o=m.getObjectByName('orb');o&&(o.rotation.y+=dt*3)}}
 updCust(dt,t);
 bub.step(dt,-1.5);spark.step(dt,2);
 if(Math.random()<dt*14)bub.emit(ctx.cauldron.x+(Math.random()-.5)*.9,1.6,ctx.cauldron.z+(Math.random()-.5)*.9,1,.3,.9,2);
 pulse=Math.max(0,pulse-dt*2);glow.intensity=2+Math.sin(t*3)*.4+pulse*6;lamp.intensity=1.6+Math.sin(t*5)*.08;
 ctx.liq.position.y=1.62+Math.sin(t*4)*.02;ctx.cg.scale.setScalar(.85*(1+pulse*.08));

   const w=cust.find(c=>c.si==0&&c.st=='wait'),k=w&&count(w.k)==0&&!stock.some(x=>x.k==w.k)?w.k:sel;brew(true,k)}}else prog=Math.max(0,prog-dt*.5);
 rp.style.strokeDashoffset=138.2*(1-prog);
 if(toastT>0){toastT-=dt;if(toastT<=0){tip.textContent='Tap the cauldron to brew · customers buy from the shelves';tip.className=''}}
 const z=zoom,dd=base*z;cam.position.set(tgt.x+dd*Math.sin(ph)*Math.sin(th),tgt.y+dd*Math.cos(ph),tgt.z+dd*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);cam.updateMatrixWorld()}

const pts=new Map(),rc=new T.Raycaster();let pd=0,moved=0;const cvs=r.domElement;cvs.style.touchAction='none';

 if(pts.size==2){const [a,b]=[...pts.values()],nd=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)zoom=Math.min(1.1,Math.max(.5,zoom-(nd-pd)*.004));pd=nd;moved+=99}});
