<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,"><title>Wizard Tower</title>
<style>canvas{display:block;touch-action:none}:root{--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#1B1534;overflow:hidden;touch-action:none;font-family:sans-serif}
#hud{position:fixed;top:calc(10px + var(--st));left:calc(10px + var(--sl));min-height:48px;box-sizing:border-box;color:#FFC83D;font:bold 22px sans-serif;background:#1B1534cc;padding:8px 14px;border-radius:14px;border:2px solid #FFC83D}
#sel{position:fixed;bottom:calc(34px + var(--sb));left:0;right:0;display:flex;gap:10px;justify-content:center;padding:0 calc(10px + var(--sr)) 0 calc(10px + var(--sl))}
.b{flex:1;max-width:130px;min-height:64px;min-width:48px;position:relative;border-radius:16px;border:3px solid var(--c);background:#1B1534dd;color:#F1E2B8;font:bold 13px sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
.b i{font-style:normal;font-size:24px}.b.on{background:var(--c);color:#1B1534;box-shadow:0 0 14px var(--c)}
#ring{position:fixed;top:calc(10px + var(--st));right:calc(10px + var(--sr));width:54px;height:54px}
#tip{position:fixed;bottom:calc(8px + var(--sb));width:100%;text-align:center;color:#F1E2B8;font-size:14px;pointer-events:none}
/* tier frames: T1 plain, T2 bronze collar, T3 silver, T4 gold */
.t1{outline:2px solid #5C5080;outline-offset:-7px}
.t2{box-shadow:0 0 0 3px #B9783A,inset 0 0 0 3px #1B1534,inset 0 0 0 5px #D9964F}
.t3{box-shadow:0 0 0 3px #C9D3E6,inset 0 0 0 3px #1B1534,inset 0 0 0 5px #C9D3E6}
.b.on.t2{box-shadow:0 0 0 3px #B9783A,inset 0 0 0 3px #1B1534,inset 0 0 0 5px #D9964F,0 0 14px var(--c)}
.b svg{width:26px;height:26px;fill:currentColor}.tb{position:absolute;top:-9px;right:-4px;background:#1B1534;color:#F1E2B8;border:2px solid #5C5080;border-radius:9px;font:bold 11px sans-serif;padding:1px 6px}
.t2 .tb{border-color:#D9964F;color:#FFD9A0}
#res{position:fixed;top:calc(70px + var(--st));left:50%;transform:translateX(-50%) scale(.8);opacity:0;transition:.25s;display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 16px;border-radius:18px;background:#1B1534ee;color:#F1E2B8;font:bold 16px sans-serif;border:3px solid var(--c,#5C5080);pointer-events:none;white-space:nowrap}
#res.show{opacity:1;transform:translateX(-50%) scale(1)}#res svg{width:28px;height:28px;fill:var(--c)}
@media (max-height:450px){#res{top:calc(8px + var(--st))}.b{min-height:52px}#tip{display:none}#sel{bottom:calc(10px + var(--sb))}}
</style></head><body>
<div id="hud">🪙 <span id="c">0</span></div><svg id="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="#1B1534cc" stroke="#3B3358" stroke-width="6"/><circle id="rp" cx="27" cy="27" r="22" fill="none" stroke="#FFC83D" stroke-width="6" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2" transform="rotate(-90 27 27)"/></svg>
<div id="sel"><button class="b on t1" style="--c:#2EA8FF" data-k="0"><span class="tb">T1</span><svg viewBox="0 0 24 24"><path d="M12 2C8 8 5 11.5 5 15a7 7 0 0014 0c0-3.500-3-7-7-13z"/></svg>Healing</button><button class="b t1" style="--c:#FF5A1F" data-k="1"><span class="tb">T1</span><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 01-12 0c0-3 2-4 2-7 2 1 3 2 3 4 1-3 1-6 1-9z"/></svg>Ember</button><button class="b t2" style="--c:#B9A8FF" data-k="2"><span class="tb">T2</span><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 019 9h-3a6 6 0 00-6-6V3zM12 21a9 9 0 01-9-9h3a6 6 0 006 6v3zM12 8a4 4 0 014 4h-2a2 2 0 00-2-2V8z"/></svg>Gust</button></div><div id="res"></div>
<div id="tip">Tap the cauldron to brew · it brews itself when idle</div>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as T from 'three';
const P={ink:0x1B1534,sd:0x3B3358,sm:0x5C5080,sl:0x8A7FB0,wd:0x5A3A28,wl:0xA5683A,parch:0xF1E2B8,gold:0xFFC83D,vio:0x9B5CFF,grn:0x5CFFB0};
const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const s=new T.Scene();s.background=new T.Color(P.ink);s.fog=new T.Fog(P.ink,12,26);
const cam=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,60);
function fit(){cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?50/Math.max(.55,cam.aspect)**.8:50;cam.updateProjectionMatrix()}fit();
s.add(new T.HemisphereLight(P.sl,P.sd,1.1));
const key=new T.DirectionalLight(0xFFD9A0,1.2);key.position.set(4,7,5);s.add(key);
const glow=new T.PointLight(P.grn,2,8);glow.position.set(0,1.8,0);s.add(glow);
const M=(c,rough=.85)=>new T.MeshStandardMaterial({color:c,roughness:rough,flatShading:true});
const add=(g,m,x,y,z,p=s)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o};
// room: octagonal tower
add(new T.CylinderGeometry(6,6,.4,8),M(P.sm),0,-.2,0);
const wall=add(new T.CylinderGeometry(6.2,6.2,7,8,1,true),new T.MeshStandardMaterial({color:P.sd,roughness:.9,flatShading:true,side:T.BackSide}),0,3.3,0);
for(let i=0;i<8;i++){const a=i/8*Math.PI*2+Math.PI/8;add(new T.BoxGeometry(.5,7,.5),M(P.wd),Math.sin(a)*6.1,3.3,Math.cos(a)*6.1)}
add(new T.TorusGeometry(5.8,.15,6,8),M(P.wd),0,6.8,0).rotation.x=Math.PI/2;
// rug
add(new T.CylinderGeometry(2.6,2.6,.05,8),M(0x7A3E6B),0,.03,0);
// shelves with bottles
const cols=[P.vio,P.grn,0xFF7A2E,0x6FE3FF,0xFF6F9C];
for(const a of [.9,2.2,3.9,5.3]){const g=new T.Group();g.position.set(Math.sin(a)*5.2,0,Math.cos(a)*5.2);g.rotation.y=a+Math.PI;s.add(g);
 add(new T.BoxGeometry(2.2,3.6,.6),M(P.wd),0,1.8,0,g);
 for(let h=0;h<3;h++){add(new T.BoxGeometry(2.1,.08,.7),M(P.wl),0,.9+h*1,0,g);
  for(let k=0;k<4;k++){const c=cols[(h+k+(a*3|0))%5];add(new T.SphereGeometry(.17,6,5),new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.5,flatShading:true}),-.75+k*.5,1.1+h*1,.1,g)}}}
// table + book
add(new T.CylinderGeometry(.8,.8,.1,8),M(P.wl),-3,.9,-2);add(new T.CylinderGeometry(.12,.2,.9,6),M(P.wd),-3,.45,-2);
add(new T.BoxGeometry(.6,.1,.45),M(P.parch),-3,1,-2).rotation.y=.4;
// cauldron
const cg=new T.Group();s.add(cg);
const pot=add(new T.SphereGeometry(1.1,10,8,0,Math.PI*2,Math.PI*.3,Math.PI*.7),new T.MeshStandardMaterial({color:0x2A2540,roughness:.5,flatShading:true,side:T.DoubleSide}),0,1.1,0,cg);
add(new T.TorusGeometry(.95,.1,6,12),M(0x4A4268),0,1.75,0,cg).rotation.x=Math.PI/2;
for(let i=0;i<3;i++){const a=i*2.1;add(new T.CylinderGeometry(.1,.07,.5,5),M(0x2A2540),Math.sin(a)*.7,.25,Math.cos(a)*.7,cg)}
const liq=add(new T.CircleGeometry(.9,16),new T.MeshBasicMaterial({color:P.grn}),0,1.62,0,cg);liq.rotation.x=-Math.PI/2;
cg.userData.hit=pot;
// fire logs
add(new T.BoxGeometry(1.4,.12,.15),M(P.wd),0,.08,.4).rotation.y=.5;add(new T.BoxGeometry(1.4,.12,.15),M(P.wd),0,.08,-.4).rotation.y=-.5;
// glow sprite texture
const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');const gr=x.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'#fff');gr.addColorStop(.4,'#fff6');gr.addColorStop(1,'#fff0');x.fillStyle=gr;x.fillRect(0,0,64,64);
const tex=new T.CanvasTexture(cv);
const N=120,pos=new Float32Array(N*3),vel=new Float32Array(N*3),life=new Float32Array(N);
const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(pos,3));
const pm=new T.PointsMaterial({map:tex,color:P.grn,size:.35,transparent:true,depthWrite:false,blending:T.AdditiveBlending});
s.add(new T.Points(geo,pm));
function spawn(i,burst){pos[i*3]=(Math.random()-.5)*1.2;pos[i*3+1]=1.7;pos[i*3+2]=(Math.random()-.5)*1.2;
 const k=burst?3:.5;vel[i*3]=(Math.random()-.5)*k;vel[i*3+1]=(burst?2+Math.random()*3:.4+Math.random()*.8);vel[i*3+2]=(Math.random()-.5)*k;life[i]=Math.random()*(burst?1.2:2.5)+.3}
for(let i=0;i<N;i++){spawn(i);life[i]=Math.random()*2}
let burst=0,coinEl=document.getElementById('c'),pulse=0,col=new T.Color();
const A=[{n:'Healing Draught',c:0x2EA8FF,a:0xB8F0FF,v:5,t:1,h:'#2EA8FF'},{n:'Ember Spark',c:0xFF5A1F,a:0xFFC93C,v:6,t:1,h:'#FF5A1F'},{n:'Gust Charm',c:0xE8F4FF,a:0x7A5CFF,v:9,t:2,h:'#B9A8FF'}];
const IC=['<svg viewBox="0 0 24 24"><path d="M12 2C8 8 5 11.5 5 15a7 7 0 0014 0c0-3.500-3-7-7-13z"/></svg>','<svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 01-12 0c0-3 2-4 2-7 2 1 3 2 3 4 1-3 1-6 1-9z"/></svg>','<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 019 9h-3a6 6 0 00-6-6V3zM12 21a9 9 0 01-9-9h3a6 6 0 006 6v3zM12 8a4 4 0 014 4h-2a2 2 0 00-2-2V8z"/></svg>'];const resEl=document.getElementById('res');let rt;
function showRes(k){const a=A[k];resEl.className='t'+a.t;resEl.style.setProperty('--c',a.h);resEl.innerHTML=IC[k]+a.n+' <span style="opacity:.7">T'+a.t+'</span>';requestAnimationFrame(()=>resEl.classList.add('show'));clearTimeout(rt);rt=setTimeout(()=>resEl.classList.remove('show'),3200)}
const em=(c,i=.9)=>new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i,flatShading:true,roughness:.5});
function mk(k){const g=new T.Group(),a=A[k];
 if(k==0){// potion: bottom-heavy round flask + cork, never spins fast
  add(new T.SphereGeometry(.42,10,8),new T.MeshStandardMaterial({color:a.c,emissive:a.c,emissiveIntensity:.6,flatShading:true,transparent:true,opacity:.92}),0,0,0,g);
  add(new T.CylinderGeometry(.14,.2,.3,8),em(a.a,.5),0,.5,0,g);add(new T.CylinderGeometry(.13,.13,.12,8),M(P.wl),0,.72,0,g);
  add(new T.SphereGeometry(.12,6,5),em(0xFFFFFF,1),-.15,.1,.35,g)}
 else if(k==1){// spell: floating tall spiky orb over rune plate
  const o=add(new T.OctahedronGeometry(.4,0),em(a.c,1),0,0,0,g);o.scale.y=1.6;
  add(new T.OctahedronGeometry(.2,0),em(a.a,1.4),0,0,0,g).scale.y=1.6;
  add(new T.CylinderGeometry(.5,.5,.04,6),em(a.a,.6),0,-.8,0,g)}
 else{// enchant: angular charm w/ gem + orbiting runes
  add(new T.TorusGeometry(.38,.07,5,6),M(0x8A7FB0,.4),0,0,0,g);
  add(new T.OctahedronGeometry(.2,0),em(a.a,1.2),0,0,0,g);
  add(new T.BoxGeometry(.1,.3,.1),M(0x8A7FB0,.4),0,.52,0,g);
  const o=new T.Group();o.name='orb';g.add(o);for(let i=0;i<3;i++){const q=add(new T.BoxGeometry(.1,.1,.1),em(a.c,1.2),Math.cos(i*2.09)*.62,0,Math.sin(i*2.09)*.62,o)}}
 return g}
let sel=0,item=null,itemT=0,coins=0,idle=0,prog=0;
const AUTO=12,IDLE_WAIT=3,rp=document.getElementById('rp');
const bt=[...document.querySelectorAll('.b')];
bt.forEach(b=>b.addEventListener('click',()=>{sel=+b.dataset.k;bt.forEach(x=>x.classList.toggle('on',x==b));idle=0;tint(sel)}));
function tint(k){const a=A[k];pm.color.set(a.c);liq.material.color.set(a.c);glow.color.set(a.c)}
tint(0);
function show(k){if(item){s.remove(item)}item=mk(k);item.userData.s=1.7;item.position.set(0,3.1,0);s.add(item);itemT=3.2;item.userData.k=k}
function brew(auto){const a=A[sel];const v=auto?Math.max(1,Math.round(a.v/2)):a.v;coins+=v;coinEl.textContent=coins;burst=auto?15:40;pulse=auto?.5:1;show(sel);showRes(sel);prog=0;
 tint(sel);if(!auto)idle=0;chime(sel);
 const hud=document.getElementById('hud');hud.animate([{transform:'scale(1.2)'},{transform:'scale(1)'}],200)}
let ac;function chime(k){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=[440,523,659][k];g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.05,ac.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.6);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.65)}catch(e){}}
// orbit
let th=.6,ph=1.15,d=14.5;const tgt=new T.Vector3(0,2,0);
const pts=new Map();let pd=0,moved=0;
r.domElement.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=0;idle=0});
r.domElement.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
 if(pts.size==1){const dx=e.clientX-p[0],dy=e.clientY-p[1];moved+=Math.abs(dx)+Math.abs(dy);th-=dx*.006;ph=Math.min(1.45,Math.max(.4,ph-dy*.006))}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size==2){const [a,b]=[...pts.values()];const nd=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)d=Math.min(16,Math.max(5,d-(nd-pd)*.03));pd=nd;moved+=99}});
const rc=new T.Raycaster();
r.domElement.addEventListener('pointerup',e=>{pts.delete(e.pointerId);
 if(moved<8){rc.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
  if(rc.intersectObjects(cg.children).length)brew(false)}});
r.domElement.addEventListener('wheel',e=>{d=Math.min(16,Math.max(5,d+e.deltaY*.01))});
function rs(){r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(innerWidth,innerHeight);fit()}addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,200));r.domElement.style.touchAction='none';
const clk=new T.Clock();
r.setAnimationLoop(()=>{const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
 cam.position.set(tgt.x+d*Math.sin(ph)*Math.sin(th),tgt.y+d*Math.cos(ph),tgt.z+d*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);
 for(let i=0;i<N;i++){life[i]-=dt;if(life[i]<=0){spawn(i,burst>0);if(burst>0)burst--}
  pos[i*3]+=vel[i*3]*dt;pos[i*3+1]+=vel[i*3+1]*dt;pos[i*3+2]+=vel[i*3+2]*dt;if(vel[i*3+1]>1)vel[i*3+1]-=4*dt}
 geo.attributes.position.needsUpdate=true;
 pulse=Math.max(0,pulse-dt*2);glow.intensity=2+Math.sin(t*3)*.4+pulse*6;
 liq.position.y=1.62+Math.sin(t*4)*.02;cg.scale.setScalar(1+pulse*.08);
 idle+=dt;if(idle>IDLE_WAIT){prog+=dt/AUTO;if(prog>=1)brew(true)}else prog=Math.max(0,prog-dt*.5);
 rp.style.strokeDashoffset=138.2*(1-prog);
 if(item){itemT-=dt;const k=item.userData.k;item.position.y=3.1+Math.sin(t*2)*.12+(3.2-itemT<.5?-(.5-(3.2-itemT))*1.2:0);
  item.rotation.y+=dt*(k==0?.6:k==1?1.8:1);if(k==2){item.rotation.z=Math.sin(t*1.5)*.2;const o=item.getObjectByName('orb');if(o)o.rotation.y+=dt*3}
  
  const sc=item.userData.s*Math.min(1,itemT*1.5,(3.2-itemT)*4);item.scale.x=item.scale.z=Math.max(.001,sc);if(k!=1)item.scale.y=Math.max(.001,sc);
  if(itemT<=0){s.remove(item);item=null}}
 r.render(s,cam)});
</script></body></html>
